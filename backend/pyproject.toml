[project]
name = "roomsplit-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "email-validator",
    "httpx",
    "python-multipart",
    "argon2-cffi",
    "itsdangerous",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyjwt>=2.15.1",
    "pillow>=13.0.0",
    "apscheduler>=3.11.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

